function renderContacts(contacts) {
  return contacts.map(c => {
    if (c.links) {
      const anchors = c.links.map(l =>
        '<a href="' + l.href + '" target="_blank" rel="noopener">' + l.text + '</a>'
      ).join(" · ");
      return '<span class="full">' + c.text + anchors + '</span>';
    }
    if (c.href) {
      return '<span><a href="' + c.href + '" target="_blank" rel="noopener">' + c.text + '</a></span>';
    }
    return '<span class="muted">' + c.text + '</span>';
  }).join("");
}

function renderSection(s) {
  let body = "";
  if (s.type === "entries") {
    body = s.items.map(item => {
      let html = '<div class="entry"><div class="entry-title">' + item.title + "</div>";
      if (item.bullets && item.bullets.length) {
        html += "<ul>" + item.bullets.map(b => "<li>" + b + "</li>").join("") + "</ul>";
      }
      return html + "</div>";
    }).join("");
  } else if (s.type === "paragraphs") {
    body = s.paragraphs.map(p => "<p>" + p + "</p>").join("");
    if (s.bullets && s.bullets.length) {
      body += "<ul>" + s.bullets.map(b => "<li>" + b + "</li>").join("") + "</ul>";
    }
  } else if (s.type === "bullets") {
    body = "<ul>" + s.bullets.map(b => "<li>" + b + "</li>").join("") + "</ul>";
  } else if (s.type === "groups") {
    body = s.groups.map(g =>
      '<div class="skills-group"><div class="skills-group-title">' + g.title + "</div>" +
      "<ul>" + g.bullets.map(b => "<li>" + b + "</li>").join("") + "</ul></div>"
    ).join("");
  }
  return '<section id="' + s.id + '"><h2><span class="bar"></span>' + s.title + "</h2>" + body + "</section>";
}

  document.getElementById("footer").textContent = d.footer;
  document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
}

function currentLang() {
  const fromHash = location.hash.replace("#", "");
  if (fromHash === "zh" || fromHash === "en") return fromHash;
  const stored = localStorage.getItem("cv-lang");
  if (stored === "zh" || stored === "en") return stored;
  return "zh";
}

let lang = currentLang();
render(lang);

document.getElementById("btn-zh").addEventListener("click", () => setLang("zh"));
document.getElementById("btn-en").addEventListener("click", () => setLang("en"));

function setLang(next) {
  lang = next;
  localStorage.setItem("cv-lang", next);
  history.replaceState(null, "", "#" + next);
  render(next);
}

window.addEventListener("hashchange", () => {
  const next = currentLang();
  if (next !== lang) {
    lang = next;
    render(next);
  }
});
</script>
</body>
</html>
